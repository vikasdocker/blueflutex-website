<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — BlueFluteX</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" />
<link rel="stylesheet" href="/assets/css/fonts.css" />
<link rel="stylesheet" href="/assets/css/site.css" />
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; }
  .nf__in { padding: 40px 0; }
  .nf__code {
    font-family: var(--f-display); font-size: clamp(6rem, 22vw, 14rem);
    line-height: .8; letter-spacing: -.04em; color: var(--rule-strong);
  }
  .nf h1 { font-family: var(--f-display); font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: -.025em; margin-top: 18px; }
  .nf p { margin: 16px auto 32px; max-width: 44ch; color: var(--muted); }
  .nf__acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
</style>
</head>
<body>
<main class="nf">
  <div class="wrap nf__in">
    <p class="nf__code" aria-hidden="true">404</p>
    <h1>This page isn’t here.</h1>
    <p>
      The link may be out of date, or the page may have moved. Nothing is broken
      on your side.
    </p>
    <div class="nf__acts">
      <a class="btn btn--ink btn--lg" href="/">Back to the homepage</a>
      <a class="btn btn--line btn--lg" href="/#contact">Start a project</a>
    </div>
  </div>
</main>
</body>
</html>
