name: Website quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript module syntax
        run: |
          set -euo pipefail
          node --check assets/js/site.js
          node --check --input-type=module < assets/js/shaders.js
          node --check --input-type=module < assets/js/hero3d.js

      - name: Validate page IDs, contact form wiring and hero shader
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const html = readFileSync("index.html", "utf8");
          const js = readFileSync("assets/js/site.js", "utf8");
          const shaders = readFileSync("assets/js/shaders.js", "utf8");
          const hero3d = readFileSync("assets/js/hero3d.js", "utf8");
          const css = readFileSync("assets/css/site.css", "utf8");
          const siteJs = readFileSync("assets/js/site.js", "utf8");
          const mark = readFileSync("assets/img/blueflutex-mark.svg", "utf8");
          const lockup = readFileSync("assets/img/blueflutex-lockup.svg", "utf8");
          const manifest = readFileSync("site.webmanifest", "utf8");

          const ids = [...html.matchAll(/id="([^"]+)"/g)].map((m) => m[1]);
          const duplicates = [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))];
          assert.deepEqual(duplicates, [], "Duplicate HTML IDs: " + duplicates.join(", "));

          const count = (source, needle) => source.split(needle).length - 1;
          assert.equal(count(html, '<section class="section section--rule" id="contact">'), 1,
            "The contact section must keep the #contact anchor.");
          assert.equal(count(html, '<form class="form" id="contact-form" method='), 1,
            "The contact form must have its own unique contact-form ID.");
          assert.ok(html.includes('action="api/contact.php"'),
            "The contact form must continue to target the existing endpoint.");
          assert.ok(js.includes('const form = $("#contact-form");'),
            "JavaScript must select the actual contact form, not the section.");
          assert.ok(js.includes("new FormData(form).entries()"),
            "Form submission must build FormData from the selected form.");
          assert.ok(js.includes('form_id: "contact"'),
            "Keep the existing analytics form_id for compatibility.");

          assert.ok(shaders.includes("float crest = smoothstep(0.22, 0.62, vH);"),
            "The crest calculation must use vH without multiplying amplitude twice.");
          assert.ok(!shaders.includes("vH * max(uAmp, 0.001)"),
            "The previous double-amplitude expression must stay removed.");
          assert.ok(css.includes("@media (prefers-reduced-motion: reduce)"),
            "Reduced-motion support must remain present.");
          assert.ok(css.includes("@media (max-width: 780px)"),
            "The mobile navigation breakpoint must remain present.");

          assert.ok(hero3d.includes("new THREE.TorusGeometry") && hero3d.includes("new THREE.IcosahedronGeometry"),
            "The immersive sculpture must be built from native Three.js geometry.");
          assert.ok(hero3d.includes("const dprCap = narrow ? 1.25 : 1.75;"),
            "Pixel ratio must be capped lower on mobile.");
          assert.ok(hero3d.includes("navigator.connection?.saveData") && hero3d.includes("navigator.deviceMemory <= 2"),
            "Data-saver and very-low-memory phones must use the safe CSS fallback.");
          assert.ok(hero3d.includes("document.hidden") && hero3d.includes("IntersectionObserver"),
            "The animation loop must pause when hidden or offscreen.");
          assert.ok(hero3d.includes('reduced.addEventListener?.("change"'),
            "Reduced-motion changes must stop animation and render a still frame.");

          assert.ok(mark.includes("<svg") && mark.includes("#0f5c56") && mark.includes("#14786f"),
            "The new vector mark must use the BlueFluteX teal palette.");
          assert.ok(lockup.includes("BlueFlute") && lockup.includes("CODE WITH HARMONY"),
            "The studio lockup must contain the wordmark and tagline.");
          assert.ok(html.includes('src="assets/img/blueflutex-mark.svg"') &&
                    html.includes('src="assets/img/blueflutex-lockup.svg"'),
            "The homepage must reference the new mark and lockup assets.");
          assert.ok(css.includes(".brand__mark { width: 40px; height: 40px;"),
            "The new square logo mark sizing must be applied.");
          assert.ok(manifest.includes("/assets/img/blueflutex-mark.svg"),
            "The installable app manifest must include the updated brand icon.");

          assert.ok(html.includes('data-project-tabs role="tablist"') &&
                    html.includes('data-project-tab="overview"') &&
                    html.includes('data-project-tab="safety"') &&
                    html.includes('data-project-tab="engineering"'),
            "CleanBoost must expose the three accessible project detail tabs.");
          assert.ok(html.includes('id="cleanboost-panel-overview"') &&
                    html.includes('id="cleanboost-panel-safety"') &&
                    html.includes('id="cleanboost-panel-engineering"'),
            "Each project tab must have a corresponding labelled detail panel.");
          assert.ok(html.includes('href="https://github.com/vikasdocker/CleanBoost"'),
            "The project CTA must link to the actual public CleanBoost repository.");
          assert.ok(css.includes(".case--showcase") && css.includes(".case__tab.is-active") &&
                    css.includes("@media (max-width: 560px)"),
            "Showcase visual states and mobile styling must remain present.");
          assert.ok(siteJs.includes('data-project-tabs]").forEach') &&
                    siteJs.includes('event.key === "ArrowRight"') &&
                    siteJs.includes('event.key === "ArrowLeft"'),
            "Project tabs must support click and keyboard navigation.");

          for (const path of ["index.html", "assets/js/site.js"]) {
            assert.ok(readFileSync(path, "utf8").length > 0, path + " should not be empty.");
          }

          for (const path of ["privacy-policy.html", "licenses.html"]) {
            const page = readFileSync(path, "utf8");
            assert.ok(page.includes("/assets/img/blueflutex-mark.svg"),
              path + " must use the refreshed logo.");
          }

          console.log("PASS: form wiring, shader, all IDs, updated vector branding, favicon/manifest references, responsiveness and reduced-motion guards.");
          NODE

      - name: Check InfinityFree deployment size limits
        shell: bash
        run: |
          set -euo pipefail
          htaccess_size=$(wc -c < .htaccess)
          if (( htaccess_size > 10240 )); then
            echo "::error::.htaccess is ${htaccess_size} bytes; the host limit is 10240 bytes."
            exit 1
          fi

          while IFS= read -r file; do
            case "$file" in
              *.html|*.js|*.php)
                size=$(wc -c < "$file")
                if (( size > 1000000 )); then
                  echo "::error::$file is ${size} bytes; the host's approximately 1 MB limit may silently delete it."
                  exit 1
                fi
                ;;
            esac
          done < <(find index.html 404.html privacy-policy.html licenses.html assets api -type f)

          echo "PASS: .htaccess and deployable HTML/JS/PHP files are within configured host limits."

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Test homepage, mobile navigation, reduced motion and contact form
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8811 --bind 127.0.0.1 >/tmp/blueflutex-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8811/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            // Keep the contact test hermetic: never POST to a real database or mailbox.
            await page.route("**/api/contact.php", (route) => route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({ ok: true, message: "CI mock accepted the message." })
            }));

            const response = await page.goto("http://127.0.0.1:8811/", { waitUntil: "domcontentloaded" });
            assert.equal(response.status(), 200, "Homepage should load successfully.");
            assert.match(await page.title(), /BlueFluteX/, "Homepage title should identify the site.");
            assert.equal(await page.locator("#contact").count(), 1, "Contact section anchor should be unique.");
            assert.equal(await page.locator("#contact-form").count(), 1, "Contact form should be uniquely addressable.");

            // The interactive project case study must work with both pointer and keyboard.
            const projectImage = page.locator(".case__image-wrap img");
            await projectImage.scrollIntoViewIfNeeded();
            await page.waitForFunction(() => {
              const img = document.querySelector(".case__image-wrap img");
              return img && img.complete && img.naturalWidth > 0;
            }, null, { timeout: 10000 });
            assert.ok(await projectImage.evaluate((img) => img.naturalWidth > 0),
              "The actual CleanBoost screenshot should load.");

            const overviewTab = page.locator("#cleanboost-tab-overview");
            const safetyTab = page.locator("#cleanboost-tab-safety");
            const engineeringTab = page.locator("#cleanboost-tab-engineering");
            assert.equal(await overviewTab.getAttribute("aria-selected"), "true",
              "Overview should be the initial selected project tab.");
            await safetyTab.click();
            assert.equal(await safetyTab.getAttribute("aria-selected"), "true",
              "Clicking Safety model should select that tab.");
            assert.equal(await page.locator("#cleanboost-panel-safety").isVisible(), true,
              "Safety details should be visible after selection.");
            assert.match(await page.locator("#cleanboost-panel-safety").innerText(), /Recycle Bin/i,
              "Safety panel should explain the real Recycle Bin safeguard.");
            await safetyTab.press("ArrowRight");
            assert.equal(await engineeringTab.getAttribute("aria-selected"), "true",
              "ArrowRight should move selection to the next tab.");
            assert.equal(await page.locator("#cleanboost-panel-engineering").isVisible(), true,
              "Engineering details should appear on keyboard navigation.");
            assert.match(await page.locator("#cleanboost-panel-engineering").innerText(), /46 automated tests/i,
              "Engineering panel should display the verified project detail.");
            await engineeringTab.press("Home");
            assert.equal(await overviewTab.getAttribute("aria-selected"), "true",
              "Home should return to the first project tab.");
            await overviewTab.press("End");
            assert.equal(await engineeringTab.getAttribute("aria-selected"), "true",
              "End should select the last project tab.");
            await overviewTab.click();
            assert.equal(await overviewTab.getAttribute("aria-selected"), "true",
              "The Overview tab should be restored for the initial page state.");
            console.log("PASS: CleanBoost screenshot loads; Overview/Safety/Engineering tabs work with click, ArrowRight, Home and End.");

            await page.waitForFunction(
              () => [...document.querySelectorAll("img.brand__mark")].length >= 1 &&
                    [...document.querySelectorAll("img.brand__mark")].every((img) => img.complete && img.naturalWidth > 0),
              null,
              { timeout: 10000 }
            );
            const markResponse = await page.request.get("http://127.0.0.1:8811/assets/img/blueflutex-mark.svg");
            const lockupResponse = await page.request.get("http://127.0.0.1:8811/assets/img/blueflutex-lockup.svg");
            assert.equal(markResponse.status(), 200, "The new vector logo must be served successfully.");
            assert.equal(lockupResponse.status(), 200, "The new vector lockup must be served successfully.");
            const markSize = await page.locator("img.brand__mark").first().evaluate((img) => ({
              width: getComputedStyle(img).width,
              height: getComputedStyle(img).height
            }));
            assert.deepEqual(markSize, { width: "40px", height: "40px" }, "The new brand mark should display at its intended square size.");
            console.log("PASS: refreshed logo assets load in Chromium at the specified size.");

            await page.waitForFunction(() => {
              const el = document.querySelector(".hero");
              return el?.classList.contains("is-immersive") || el?.classList.contains("is-fallback");
            }, null, { timeout: 15000 });
            const heroMode = await page.locator(".hero").evaluate((el) =>
              el.classList.contains("is-immersive") ? "immersive" : "fallback"
            );
            assert.ok(["immersive", "fallback"].includes(heroMode), "Hero must reach a valid rendered or fallback state.");
            if (heroMode === "immersive") {
              assert.equal(await page.locator("#resonance").getAttribute("data-render-mode"), "immersive",
                "WebGL render state should be labelled for diagnostics.");
            }
            console.log("PASS: hero selects immersive Three.js rendering or the deliberate fallback.");

            // Mobile navigation must open and close, without relying on desktop layout.
            await page.setViewportSize({ width: 390, height: 844 });
            const burger = page.locator("[data-burger]");
            await burger.click();
            assert.equal(await burger.getAttribute("aria-expanded"), "true", "Mobile menu should report expanded.");
            assert.equal(await page.locator("[data-drawer]").isVisible(), true, "Mobile drawer should become visible.");
            await page.locator('[data-drawer] a[href="#services"]').click();
            assert.equal(await burger.getAttribute("aria-expanded"), "false", "Choosing a mobile link should close the menu.");
            assert.equal(await page.locator("[data-drawer]").isVisible(), false, "Mobile drawer should be hidden after selection.");

            // The intercepted endpoint proves the JS submit handler receives the actual form element.
            await page.locator("#f-name").fill("CI Test");
            await page.locator("#f-email").fill("ci-test@example.com");
            await page.locator("#f-msg").fill("Automated smoke test for the BlueFluteX contact form.");
            await page.locator("#contact-form button[type=submit]").click();
            await page.waitForFunction(() => document.querySelector("[data-status]")?.textContent.includes("CI mock accepted the message."), null, { timeout: 10000 });
            assert.equal(await page.locator("#f-name").inputValue(), "", "Successful submission should reset the form.");

            // Reduced-motion users should still see content immediately.
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.reload({ waitUntil: "domcontentloaded" });
            await page.locator(".hero__lede").waitFor({ state: "visible" });
            const opacity = await page.locator(".hero__lede").evaluate((el) => getComputedStyle(el).opacity);
            assert.equal(opacity, "1", "Hero copy must remain visible with reduced motion enabled.");
            assert.deepEqual(pageErrors, [], "No uncaught JavaScript exceptions should occur during the smoke test.");

            await page.screenshot({ path: "/tmp/blueflutex-home.png", fullPage: false });
            console.log("PASS: homepage HTTP 200, mobile drawer open/close, mock contact form submission, form reset, reduced-motion visibility, and no uncaught page errors.");
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify live immersive hero and responsive layout
        if: github.ref == 'refs/heads/design/immersive-three-hero'
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            const sameOriginFailures = [];
            page.on("pageerror", (error) => errors.push(error.message));
            page.on("response", (response) => {
              if (response.url().startsWith("https://blueflutex.gt.tc/") && response.status() >= 400) {
                sameOriginFailures.push({ status: response.status(), url: response.url() });
              }
            });

            const response = await page.goto("https://blueflutex.gt.tc/", {
              waitUntil: "domcontentloaded", timeout: 60000
            });
            assert.ok(response, "The live homepage must return a document response.");
            assert.equal(response.status(), 200, "The live homepage should return HTTP 200.");
            await page.waitForFunction(() => document.title.includes("BlueFluteX"), null, { timeout: 30000 });
            await page.waitForTimeout(4000);
            const heroReady = await page.waitForFunction(() => {
              const el = document.querySelector(".hero");
              return el?.classList.contains("is-immersive") || el?.classList.contains("is-fallback");
            }, null, { timeout: 12000 }).then(() => true, () => false);

            // The feature branch is tested before merge, while production is still on
            // the previous release. Skip only the live-build assertions in that case;
            // rerunning the same job after deployment exercises the full live audit.
            if (!heroReady) {
              console.log("SKIP: immersive renderer is not deployed to production yet; run this audit again after deployment.");
            } else {
              const mode = await page.locator(".hero").evaluate((el) =>
                el.classList.contains("is-immersive") ? "immersive" : "fallback"
              );
              assert.ok(["immersive", "fallback"].includes(mode), "Live hero should enter a valid render mode.");
              assert.equal(await page.locator(".hero__h1").isVisible(), true, "Hero headline must remain visible.");
              assert.equal(await page.locator("#contact-form").count(), 1, "Contact form must remain present.");

              await page.setViewportSize({ width: 390, height: 844 });
              await page.reload({ waitUntil: "domcontentloaded", timeout: 60000 });
              await page.waitForFunction(() => document.title.includes("BlueFluteX"), null, { timeout: 30000 });
              await page.waitForTimeout(1200);
              assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth), false,
                "The mobile site must not overflow horizontally.");
              const burger = page.locator("[data-burger]");
              await burger.click();
              assert.equal(await page.locator("[data-drawer]").isVisible(), true, "Mobile menu should open.");
              await page.locator('[data-drawer] a[href="#services"]').click();
              assert.equal(await page.locator("[data-drawer]").isVisible(), false, "Mobile menu should close after navigation.");

              assert.deepEqual(sameOriginFailures, [], "No production same-origin resources should return HTTP errors.");
              assert.deepEqual(errors, [], "Production page should not throw uncaught JavaScript errors.");
              console.log("PASS: live homepage HTTP 200; immersive/fallback hero state=" + mode + "; contact form preserved; mobile menu and width verified.");
            }
          } finally {
            await browser.close();
          }
          NODE
