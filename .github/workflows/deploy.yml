name: Deploy to InfinityFree

# The site is static, so there is nothing to build. This workflow exists
# purely to push the deployable files to the host over FTP.
#
# Required repository secret:
#   FTP_PASSWORD  — the password for the InfinityFree account
# Account handle (used as the FTP username) is fixed below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # InfinityFree silently deletes anything uploaded outside htdocs, and
      # FTP listings cap around 5000 items per folder -- so we ship exactly
      # the deployable set, flat, and nothing else.
      - name: Stage deployable files
        run: |
          set -euo pipefail
          mkdir -p _deploy

          cp index.html 404.html privacy-policy.html licenses.html \
             site.webmanifest .htaccess _deploy/
          cp -r assets api _deploy/

          # .htaccess must survive the copy as a dotfile
          ls -la _deploy/.htaccess

          # api/contact.local.php holds the database password and is gitignored,
          # so it is absent from a fresh clone but present in a maintainer's
          # checkout. The server needs it for the contact form to store
          # anything, so deploy it when it exists -- and say so loudly rather
          # than letting it ride along unannounced.
          if [ -f _deploy/api/contact.local.php ]; then
            echo "::warning::deploying api/contact.local.php (contains DB credentials) to the server"
          else
            echo "::notice::api/contact.local.php not present - the contact form will fall back to directing visitors to email"
          fi

          echo "--- staged ---"
          find _deploy -type f | sort
          echo "--- size ---"
          du -sh _deploy

          # InfinityFree deletes files over 1 MB (HTML/PHP/JS) and any file
          # over 10 MB, silently. Fail the build here instead.
          BIG=$(find _deploy -type f \( -name '*.js' -o -name '*.php' -o -name '*.html' \) -size +1000k | head)
          if [ -n "$BIG" ]; then
            echo "::error::file(s) exceed the InfinityFree 1 MB limit:"
            echo "$BIG"
            exit 1
          fi

          HT=$(stat -c%s _deploy/.htaccess)
          if [ "$HT" -gt 10240 ]; then
            echo "::error::.htaccess is ${HT} bytes; InfinityFree deletes anything over 10 kB"
            exit 1
          fi

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.infinityfree.com' }}
          username: ${{ secrets.FTP_USERNAME || 'if0_41314745' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_deploy/
          server-dir: /htdocs/
          # remove files from the server that no longer exist locally, so a
          # deleted page does not linger
          sync-all: true
          timeout-minutes: 10