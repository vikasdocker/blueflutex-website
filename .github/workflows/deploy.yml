name: Deploy to InfinityFree

# The site is static, so there is nothing to compile. This workflow exists to
# put the deployable files on the host, and to get the database credentials
# there without them ever entering git.
#
# Repository secrets:
#   FTP_SERVER    (optional, defaults to ftp.infinityfree.com)
#   FTP_USERNAME  (optional, defaults to the account handle)
#   FTP_PASSWORD  required
#   DB_NAME       optional - enables the contact form
#   DB_USER       optional
#   DB_PASS       optional

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ci/contact.local.php is gitignored, so a CI clone never has it. Write
      # it from secrets so the credentials reach the server -- and the server
      # only -- with nothing landing in the repository.
      - name: Write database credentials
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${DB_NAME:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ]; then
            echo "::notice::DB secrets not set - the contact form will fall back to directing visitors to email"
            exit 0
          fi

          # %s inside single quotes is literal in printf, and the values are
          # written with single quotes around them, so this cannot inject PHP.
          {
            echo '<?php'
            printf "define('BFX_DB_NAME', '%s');\n" "$DB_NAME"
            printf "define('BFX_DB_USER', '%s');\n" "$DB_USER"
            printf "define('BFX_DB_PASS', '%s');\n" "$DB_PASS"
          } > api/contact.local.php

          php -l api/contact.local.php
          echo "::warning::api/contact.local.php built from secrets and staged for upload to the server"

      # InfinityFree silently deletes anything uploaded outside htdocs, and
      # FTP listings cap around 5000 items per folder -- so we ship exactly
      # the deployable set, flat, and nothing else.
      - name: Stage deployable files
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir -p _deploy

          cp index.html 404.html privacy-policy.html licenses.html \
             site.webmanifest .htaccess _deploy/
          cp -r assets api _deploy/

          # .htaccess must survive the copy as a dotfile
          test -f _deploy/.htaccess

          echo "--- staged ---"
          find _deploy -type f | sort
          echo "--- size ---"
          du -sh _deploy

          # InfinityFree deletes files over 1 MB (HTML/PHP/JS) and any file
          # over 10 MB, silently. Fail here instead of letting them vanish.
          BIG=$(find _deploy -type f \( -name '*.js' -o -name '*.php' -o -name '*.html' \) -size +1000k | head)
          if [ -n "$BIG" ]; then
            echo "::error::file(s) exceed the InfinityFree 1 MB limit:"
            echo "$BIG"
            exit 1
          fi

          HT=$(stat -c%s _deploy/.htaccess)
          if [ "$HT" -gt 10240 ]; then
            echo "::error::.htaccess is ${HT} bytes; InfinityFree deletes anything over 10 kB"
            exit 1
          fi

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        timeout-minutes: 10
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.infinityfree.com' }}
          username: ${{ secrets.FTP_USERNAME || 'if0_41314745' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_deploy/
          server-dir: /htdocs/
          # Remove server files absent from local-dir.
          #
          # This is what actually deletes the previous generation: the old
          # static root and admin.html, whose login was plaintext comparison
          # against localStorage and was publicly reachable. The earlier
          # `sync-all` input was invalid for this action and was silently
          # ignored, so those files survived a deploy that reported success.
          #
          # It clears anything in htdocs that we do not ship. Keep this in mind
          # if you ever put something there by hand.
          dangerous-clean-slate: true